summary: "Emerson's 1841 essay on the moral law of compensation — the doctrine that every gain is matched by an equivalent loss, every pain by a corresponding pleasure, and that the universe is governed by a balance between polarities. A companion piece to Self-Reliance, applying transcendentalist metaphysics to ethics."
