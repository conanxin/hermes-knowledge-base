summary: Orwell's 1946 essay on the four motives for writing — sheer egoism, aesthetic
  enthusiasm, historical impulse, and political purpose — and how his Burmese police
  years, poverty, Hitler, and the Spanish Civil War pushed him from a natural novelist
  into a political writer.
summary_zh: 奥威尔 1946 年的散文，谈写作的四大动机——纯粹的自我主义、美学热情、历史冲动与政治目的——以及他在缅甸当警察、贫困、希特勒与西班牙内战的经历，如何把他从一个天然的小说家推向政治写作者。
